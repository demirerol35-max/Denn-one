name: Mushaf edition validation
on:
  push:
    paths:
      - 'mushaf.mjs'
      - 'tests/mushaf.test.mjs'
      - '.github/workflows/mushaf-tests.yml'
  pull_request:
    paths:
      - 'mushaf.mjs'
      - 'tests/mushaf.test.mjs'
      - '.github/workflows/mushaf-tests.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mushaf.test.mjs
