name: Mushaf edition validation
on:
  push:
    paths:
      - 'mushaf.mjs'
      - 'tests/mushaf.test.mjs'
      - 'tests/mushaf-security.test.mjs'
      - '.github/workflows/mushaf-tests.yml'
  pull_request:
    paths:
      - 'mushaf.mjs'
      - 'tests/mushaf.test.mjs'
      - '.github/workflows/mushaf-tests.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: node --check mushaf.mjs && node --check tests/mushaf.test.mjs && node --check tests/mushaf-security.test.mjs
      - name: Run both Mushaf test suites
        run: node --test tests/mushaf.test.mjs tests/mushaf-security.test.mjs
