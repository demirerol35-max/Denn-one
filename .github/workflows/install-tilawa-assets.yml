name: Install Tilawa voice assets
on:
  push:
    paths:
      - '.github/workflows/install-tilawa-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download official Tilawa assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tilawa-assets
          curl --fail --location --retry 4 --retry-all-errors --output tilawa-assets/fastconformer_full_mixed.onnx 'https://github.com/yazinsai/tilawa/releases/download/v0.2.0/fastconformer_full_mixed.onnx'
          curl --fail --location --retry 4 --retry-all-errors --output tilawa-assets/quran.json 'https://raw.githubusercontent.com/yazinsai/tilawa/main/web/frontend/public/quran.json'
          for name in vocab.json quran_ctc_tokens.json; do
            curl --fail --location --retry 4 --retry-all-errors --output "tilawa-assets/$name" "https://github.com/yazinsai/tilawa/releases/download/v0.2.0/$name"
          done
          test "$(wc -c < tilawa-assets/fastconformer_full_mixed.onnx)" -gt 50000000
          test "$(wc -c < tilawa-assets/quran.json)" -gt 100000
          for name in quran.json vocab.json quran_ctc_tokens.json; do python -m json.tool "tilawa-assets/$name" >/dev/null; done
          ls -lh tilawa-assets/
      - name: Publish assets to site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tilawa-assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Install official Tilawa model and corpus'
            # Another commit may have landed while the large model was downloading.
            # Rebase our asset-only commit; never force-push over other changes.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'Tilawa assets published successfully'
                exit 0
              fi
              echo "Remote changed during publish; retry $attempt/5"
              sleep 3
            done
            echo 'Unable to publish assets after five safe retries' >&2
            exit 1
          fi
