name: Install Tilawa voice assets
on:
  push:
    paths:
      - '.github/workflows/install-tilawa-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download official Tilawa assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tilawa-assets
          curl --fail --location --retry 4 --retry-all-errors --output tilawa-assets/zipformer_a0w_ep1_a05.int8.onnx 'https://github.com/yazinsai/tilawa/releases/download/zipformer-a0w-ep1-a0.5/zipformer_a0w_ep1_a05.int8.onnx'
          curl --fail --location --retry 4 --retry-all-errors --output tilawa-assets/zipformer_quran.json 'https://github.com/yazinsai/tilawa/releases/download/v0.3.0/zipformer_quran.json'
          curl --fail --location --retry 4 --retry-all-errors --output tilawa-assets/NPL-1.2.txt 'https://github.com/yazinsai/tilawa/releases/download/zipformer-a0w-ep1-a0.5/NPL-1.2.txt'
          test "$(wc -c < tilawa-assets/zipformer_a0w_ep1_a05.int8.onnx)" -gt 50000000
          test "$(wc -c < tilawa-assets/zipformer_quran.json)" -gt 1000000
          python -m json.tool tilawa-assets/zipformer_quran.json >/dev/null
          ls -lh tilawa-assets/
      - name: Publish assets to site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tilawa-assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Install official Tilawa model, corpus and license'
            git push
          fi
