name: Mushaf book browser tests
on:
  push:
    paths:
      - 'vision.html'
      - 'mushaf.mjs'
      - 'tests/mushaf-book.spec.cjs'
      - 'playwright.mushaf.config.cjs'
      - '.github/workflows/mushaf-book-browser.yml'
  pull_request:
    paths:
      - 'vision.html'
      - 'mushaf.mjs'
      - 'tests/mushaf-book.spec.cjs'
      - 'playwright.mushaf.config.cjs'
      - '.github/workflows/mushaf-book-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise double-page reading and zoom
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/deen-mushaf-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx playwright test --config playwright.mushaf.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mushaf-book-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore

