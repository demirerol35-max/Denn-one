<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073d35"><title>Deen One · Aperçu montre</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px 12px 38px;background:#061c17;color:#f4f1e7;font-family:system-ui,-apple-system,sans-serif;text-align:center}.wrap{max-width:520px;margin:auto}h1{font-size:24px;margin:0 0 5px}.intro{color:#b6cbbf;font-size:13px;margin:0 0 22px}.watch{width:min(95vw,440px);aspect-ratio:1;border-radius:50%;border:10px solid #28312e;outline:3px solid #77817c;box-shadow:0 0 0 5px #111a17,0 15px 45px #0009;position:relative;overflow:hidden;margin:0 auto 24px;background:radial-gradient(ellipse at 50% 65%,#0b523c 0%,#063527 53%,#021c16 95%);isolation:isolate}.watch:before{content:"";position:absolute;inset:4%;border:1px solid #987d42;border-radius:50%;opacity:.6;pointer-events:none}.pattern{position:absolute;inset:0;opacity:.18;background:repeating-conic-gradient(from 45deg at 50% 50%,transparent 0deg 12deg,#d6b46b 12deg 13deg,transparent 13deg 25deg);mask-image:linear-gradient(#000,transparent 32%,transparent 78%,#000);pointer-events:none}.arch{position:absolute;inset:5% 7% 18%;width:86%;height:77%;z-index:0;pointer-events:none}.mosque{position:absolute;top:27%;left:3%;width:94%;height:43%;opacity:.7;z-index:0;pointer-events:none}.brand,.clock,.date,.hijri,.prayer-box,.prayer-row,.shortcut,.city{position:absolute;z-index:2}.brand{top:12%;left:0;width:100%;font-size:clamp(12px,3.4vw,17px);font-weight:750;color:#f4e4ae;text-shadow:0 2px 8px #002}.brand svg{vertical-align:middle;width:20px;height:20px}.moon{position:absolute;top:24%;left:19%;font-size:clamp(17px,5vw,30px);color:#e3bd65;z-index:1}.clock{top:28%;left:0;width:100%;font-size:clamp(44px,13vw,69px);font-weight:800;line-height:1;color:#fff;text-shadow:0 2px 12px #001a15}.date{top:44%;width:100%;font-size:clamp(11px,3.2vw,17px);color:white}.hijri{top:50%;width:100%;font-size:clamp(10px,2.7vw,14px);color:#e8d9b1}.prayer-box{top:60%;left:34%;width:32%;height:17%;border:1.5px solid #e3bd70;background:#064532dd;border-radius:16px;display:flex;flex-direction:column;justify-content:center;gap:1px}.prayer-box .label{font-size:clamp(8px,2.2vw,12px)}.prayer-box .name{font-size:clamp(15px,4.1vw,24px);font-weight:750}.prayer-box .countdown{font-size:clamp(9px,2.5vw,13px)}.shortcut{top:64%;width:17%;height:12%;border:1.5px solid #d6b66c;background:#074633ed;border-radius:50%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;font-size:clamp(9px,2.4vw,13px);cursor:pointer}.shortcut .symbol{font-size:clamp(14px,4vw,23px);color:#f1d68b}.shortcut.left{left:12%}.shortcut.right{right:12%}.prayer-row{top:81%;left:10%;width:80%;height:12%;border:1px solid #557c57;border-radius:12px;background:#002b22ef;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:3px 2px}.prayer-row span{min-width:0;font-size:clamp(7px,2vw,11px);line-height:1.35}.prayer-row strong{display:block;font-size:clamp(8px,2.3vw,13px);color:#e8d1a1}.prayer-row .active{background:#116442;border:1px solid #82b375;border-radius:9px;padding:4px 0}.prayer-row .active strong{color:white}.controls,.location{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:12px auto}.controls button,.location button{border:1px solid #a88b52;background:#12533e;color:#fff;border-radius:13px;padding:10px 14px;font:inherit}.location input{width:115px;padding:9px;border-radius:10px;border:0;font:inherit}.location label{display:flex;align-items:center;gap:6px;font-size:13px}.note{color:#b7d0c1;font-size:13px;line-height:1.5}a{color:#e5c778}@media(max-width:360px){.watch{border-width:7px}.prayer-row{left:8%;width:84%}.prayer-row span{font-size:7px}}
</style></head>
<body><main class="wrap"><h1>Deen Royal</h1><p class="intro">Cadran Deen One · aperçu interactif</p><section class="watch" aria-label="Aperçu Deen Royal">
<div class="pattern"></div><svg class="arch" viewBox="0 0 360 320" preserveAspectRatio="none" aria-hidden="true"><path d="M8 304V145 Q8 128 24 128 Q38 128 47 114 Q54 98 70 98 Q85 98 96 84 Q104 69 121 70 Q137 70 149 47 L180 13 L211 47 Q223 70 239 70 Q256 69 264 84 Q275 98 290 98 Q306 98 313 114 Q322 128 336 128 Q352 128 352 145 V304" fill="none" stroke="#d9b76c" stroke-width="3"/></svg>
<svg class="mosque" viewBox="0 0 360 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="mosque-grad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#215e42"/><stop offset="1" stop-color="#001e19"/></linearGradient></defs><path d="M0 150V110H15V85h8V45h4V29h3v16h4v40h8v65h15V105h10V88q22-41 44 0v17h12v45h14V72h6V42h5V24h3v18h5v30h6v78h14V100h12V78q23-46 46 0v22h12v50h16V83h8V49h5V30h3v19h5v34h8v67h16v-48h10V84q20-39 40 0v18h10v48h14V88h6V52h5V34h3v18h5v36h6v62h18V112h16v38" fill="url(#mosque-grad)" stroke="#8e9950" stroke-width="1"/><g fill="#d3ae5d"><rect x="26" y="67" width="3" height="12"/><rect x="147" y="60" width="3" height="10"/><rect x="296" y="69" width="3" height="12"/></g></svg>
<div class="brand">⌂ Deen One</div><span class="moon" aria-hidden="true">☾</span><div class="clock" id="clock">--:--</div><div class="date" id="date">—</div><div class="hijri" id="hijri">—</div><button class="shortcut left" id="qibla" type="button"><span class="symbol">➤</span>Qibla</button><div class="prayer-box"><span class="label">Prochaine prière</span><span class="name" id="prayer">—</span><span class="countdown" id="remaining">—</span></div><button class="shortcut right" id="add-face" type="button"><span class="symbol">◌</span>Dhikr <span id="count">0</span></button><div class="prayer-row" id="prayer-strip" aria-label="Horaires des prières"></div></section>
<div class="controls"><button id="add">+1 Dhikr</button><button id="reset">Réinitialiser</button><button id="refresh">↻ Prières</button></div><div class="location"><label>Ville <input id="city" value="Mulhouse"></label><label>Pays <input id="country" value="France"></label></div><p id="status" class="note" role="status"></p><p class="note">Aperçu web : aucun texte n'est intégré au décor. Ce n'est pas encore un cadran Wear OS installable.</p><a href="./vision.html">Retour à Deen One</a></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const prayers=['Fajr','Dhuhr','Asr','Maghrib','Isha'];let schedule=null,scheduleZone=null,scheduleDate=null,requestId=0,fromCache=false;let count=0;try{count=Math.max(0,Number(localStorage.getItem('deen-watch-dhikr')||0)||0);$('city').value=localStorage.getItem('deen-watch-city')||'Mulhouse';$('country').value=localStorage.getItem('deen-watch-country')||'France'}catch(e){}$('count').textContent=count;function tick(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(now);$('date').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short'}).format(now);if(!schedule)return;const zone=scheduleZone||Intl.DateTimeFormat().resolvedOptions().timeZone;const clockParts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));const nowMinutes=Number(clockParts.hour)*60+Number(clockParts.minute);const todayParts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:zone,day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));const today=todayParts.day+'-'+todayParts.month+'-'+todayParts.year;if(scheduleDate&&today!==scheduleDate){schedule=null;scheduleDate=null;fromCache=false;$('status').textContent='Nouvelle journée : actualisation des horaires…';load();return}const times=prayers.map(name=>{const match=String(schedule[name]||'').match(/^(\d{1,2}):(\d{2})/);return match?{name,minute:Number(match[1])*60+Number(match[2]),time:match[0]}:null}).filter(Boolean);if(!times.length)return;const nextName=(times.find(p=>p.minute>=nowMinutes)||times[0]).name;$('prayer-strip').replaceChildren(...times.map(p=>{const el=document.createElement('span');const label=document.createElement('span');label.textContent=p.name;const time=document.createElement('strong');time.textContent=p.time;el.append(label,time);if(p.name===nextName)el.classList.add('active');return el}));const next=times.find(p=>p.minute>=nowMinutes);if(!next){$('prayer').textContent='Fajr demain';$('remaining').textContent='Horaires de demain à confirmer';return;}const delta=next.minute-nowMinutes;$('prayer').textContent=next.name;$('remaining').textContent=delta===0?'Maintenant':'Dans '+Math.floor(delta/60)+' h '+String(delta%60).padStart(2,'0')+' min'}async function load(){const currentRequest=++requestId;const city=$('city').value.trim(),country=$('country').value.trim();if(!city||!country){$('status').textContent='Indiquez une ville et un pays.';return}try{localStorage.setItem('deen-watch-city',city);localStorage.setItem('deen-watch-country',country)}catch(e){}$('status').textContent='Chargement des horaires…';try{const params=new URLSearchParams({city,country,method:'12'});const response=await fetch('https://api.aladhan.com/v1/timingsByCity?'+params);if(!response.ok)throw Error('réseau');const data=await response.json();if(data.code!==200||!data.data?.timings)throw Error('ville inconnue');if(currentRequest!==requestId)return;schedule=data.data.timings;scheduleZone=data.data.meta?.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone;scheduleDate=data.data.date?.gregorian?.date||null;fromCache=false;try{localStorage.setItem('deen-watch-prayers-cache',JSON.stringify({city,country,schedule,scheduleZone,scheduleDate,hijri:data.data.date?.hijri,storedAt:Date.now()}))}catch(e){}const hijri=data.data.date?.hijri;if(hijri){$('hijri').textContent=[hijri.day,hijri.month?.en,hijri.year,'هـ'].filter(Boolean).join(' ')}$('status').textContent='Horaires chargés. Méthode UOIF/France (12) — à vérifier auprès de votre mosquée.';tick()}catch(e){if(currentRequest!==requestId)return;let cached=null;try{cached=JSON.parse(localStorage.getItem('deen-watch-prayers-cache')||'null')}catch(err){}const today=new Intl.DateTimeFormat('en-GB',{timeZone:cached?.scheduleZone||Intl.DateTimeFormat().resolvedOptions().timeZone,day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date()).replaceAll('/','-');if(cached&&cached.city===city&&cached.country===country&&cached.scheduleDate===today&&cached.schedule){schedule=cached.schedule;scheduleZone=cached.scheduleZone;scheduleDate=cached.scheduleDate;fromCache=true;const h=cached.hijri;if(h)$('hijri').textContent=[h.day,h.month?.en,h.year,'هـ'].filter(Boolean).join(' ');$('status').textContent='Mode hors ligne : horaires enregistrés pour aujourd’hui. Vérifiez leur exactitude.';tick()}else{schedule=null;scheduleDate=null;$('prayer-strip').replaceChildren();$('hijri').textContent='Date hégirienne indisponible';$('prayer').textContent='Horaires indisponibles';$('remaining').textContent='';$('status').textContent='Connexion nécessaire ou ville non reconnue. Aucun horaire du jour enregistré.'}}}$('add').onclick=()=>{count++;$('count').textContent=count;try{localStorage.setItem('deen-watch-dhikr',String(count))}catch(e){}};$('add-face').onclick=()=>$('add').click();$('qibla').onclick=()=>{location.href='./vision.html#prayer'};$('reset').onclick=()=>{if(!confirm('Réinitialiser le compteur ?'))return;count=0;$('count').textContent=0;try{localStorage.setItem('deen-watch-dhikr','0')}catch(e){}};$('refresh').onclick=load;tick();setInterval(tick,30000);load()})();
</script></body></html>
